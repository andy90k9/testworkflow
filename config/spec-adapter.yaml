# spec → DSH 用例转换配置（通用，不含项目专属值）
spec_adapter:
  # spec 输入：优先使用 spec_file；不存在时按 spec_glob 探测含 scenarios/api/ui 的 JSON
  spec_file: project/requirements/regression-spec.json
  spec_glob: project/requirements/*.json

  # 生成编号格式：seq 从 1 开始，按 spec ID 自然排序
  id_formats:
    functional: "FUNC-{seq:03d}"
    api: "API-{seq:03d}"
    ui: "UI-{seq:03d}"

  # 输出文件；转换前按 backup_existing 备份
  output:
    functional: cases/functional/portal.functional.yaml
    api: cases/api/portal.api.yaml
    ui: cases/ui/portal.ui.yaml
  backup_existing: true
  backup_dir: ../dsh-workflow-tmp/backups/cases   # 仓库外同层级临时目录

  # 未注入 run_id 前使用的占位值，流水线会统一覆盖
  run_id_placeholder: pending

  # 请求头变量：token 固定写占位符，其他变量从环境变量/spec.meta/已有用例继承
  header_variables:
    token: __DSH_API_TOKEN__
    clientId: "${DSH_CLIENT_ID}"

  # 路径/请求体变量：优先环境变量，其次从备份历史用例按路径模板反推
  path_variables: {}
  variables:
    contentId: "${DSH_CONTENT_ID}"
    skillId: "${DSH_SKILL_ID}"
    uploadUrl: "${DSH_UPLOAD_URL}"

  # UI 基础地址：留空则取 workflow.yaml -> tests.ui_base_url
  ui_base_url: ""
  ui_wait_seconds: 2
  ui_screenshot: true

  # Playwright getByRole → EGO 可执行 CSS 的映射（项目可按真实 DOM 调整）
  # EGO 没有 page.locator()/getByRole()，只接受 CSS（含 :has-text 和 >> nth=N）。
  ui_selector:
    role_aliases:
      region: '[role="region"]'
      navigation: "nav"
      heading: "h1,h2,h3,h4,h5,h6"
      button: "button"
      textbox: "input"
      link: "a"
      main: "main"
      complementary: "aside"
      banner: "header"
      list: "ul"
      listitem: "li"
    # 带 { name: ... } 时按哪个属性定位：aria-label（页面已给无障碍标签）或文本
    name_attr:
      navigation: aria-label
      region: aria-label
      heading: text
      button: text
      link: text
      textbox: text
    name_attr_default: text
    # 不设全局 nth 后缀：只有显式 .first() 才降级成 " >> nth=0"
    nth_suffix: ""

  # UI 用例模块 → 页面入口路由（spec 未写 goto 时兜底，避免落到默认首页）
  ui_routes:
    登录: /#/governance
    导航: /#/model-market
    模型广场: /#/model-market
    模型试用: /#/model-market
    我的申请: /#/my-applications
    治理审核: /#/governance?section=review
    Skill: /#/skill-market
    智能体: /#/agent-market
    MCP: /#/mcp-market
    知识库: /#/document-library

  # 试用面板：面板内控件需先点击入口按钮才会渲染，否则 fill/click 必然 0 元素命中
  trial_open_action: 'click [data-testid="model-card-trial"] >> nth=0'
  trial_panel_selectors:
    - trial-input
    - trial-send
    - trial-turn
  # spec 里写的回答容器在真实 DOM 中不存在，答案实际渲染在 trial-turn 里
  selector_overrides:
    trial-answer: trial-turn
  # antd 自动给两字中文按钮插空格，按渲染文本对齐
  text_overrides:
    重试: 重 试

  # 前提无法在自动化环境复现的用例：显式标记跳过并写明原因，避免记成假失败。
  # UI-001 需要"匿名未登录"状态，但 EGO 浏览器自带有效 SSO 会话，
  # 清 cookie + localStorage/sessionStorage 后仍被 SSO 网关直接放行。
  ui_skip_cases:
    UI-001: 需匿名未登录态，EGO 会话始终携带有效 SSO，清空 cookie/storage 后仍直接放行

  # EGO DSL 暂不支持的 Playwright 能力；命中后用例标记人工上下文并跳过，避免假失败
  # 注意：page.route/page.unroute 已由 mock_route/mock_stream（CDP 注入）支持，故不再列入
  ui_manual_patterns:
    - browser.newContext
    - storageState
    - waitForEvent
    - newPageContext

  # 优先级 → 用例分层
  priority_tiers:
    P0: core
    P1: extension
    P2: extension
    P3: extension

  # 断言解析
  assertion:
    code_json_path: $.code
    data_key_contains: true

  # ID 完整性硬校验
  id_check:
    require_all_spec_ids: true
    fail_on_duplicate: true

  # 转换报告
  report: reports/spec-conversion-report.json
