# ============================================================
# DSH 外部 Provider 接入配置（预留入口，按需填入）
# ============================================================

# —— DeepSeek Harness（用例生成引擎）——
# 对接你已有的 harness 项目。两种接入形态二选一：
#   mode: command  -> 本地命令行调用，command 里可用占位符：
#                     {requirements} 需求目录 / {source} 代码目录 / {output} 产物输出目录
#                     {run_id} 当前批次ID（流水线统一生成）
#   mode: http     -> HTTP 服务调用，POST {run_id, requirements_dir, source_dir, output_dir}
#                     到 http_endpoint，harness 返回后把产物写到 output_dir
# 输出产物约定（与 DSH 用例目录结构对齐，跑完自动做格式校验）：
#   {output_dir}/functional/*.yaml   功能用例
#   {output_dir}/api/*.yaml          API 用例
#   {output_dir}/ui/*.yaml           UI 用例
harness:
  enabled: false                      # 填好接入信息后改 true
  provider: harness                    # 用例生成引擎：harness | qa_casepipe
  mode: command                       # command | http
  command: ""                         # 例: python3 /path/to/harness/run.py --req {requirements} --src {source} --out {output} --run-id {run_id}
  http_endpoint: ""                   # 例: http://127.0.0.1:9000/generate
  http_method: POST
  http_headers: {}                    # 例: {Authorization: "Bearer xxx"}
  timeout_sec: 600
  output_dir: records/harness-output  # harness 产物落点，适配层会自动分发到 cases/

# —— qa-toolkit / qa-case-pipeline（三层用例：场景 / 接口 / UI）——
# 把 harness.provider 改成 qa_casepipe 后，用例生成阶段改由 qa-case-pipeline 承担：
#   1) gen_cases.py   : spec JSON → Markdown + Excel（三层用例）
#   2) spec 转 cases/ : 场景→cases/functional、接口→cases/api、UI→cases/ui
#   3) fill_status.py : 执行结果回填 Excel + COUNTIF 统计 + 场景层聚合
# 脚本位置：留空时按 DSH_QACASEPIPE_DIR 环境变量 → node_modules → 同级 qa-toolkit →
# ~/.dsh/profiles/*/node_modules 顺序自动探测。
qa_casepipe:
  enabled: false                      # 与 harness.enabled 一起作为生成阶段开关
  spec: project/requirements/qa-spec.json   # qa-case-pipeline spec（场景/接口/UI 三层）
  scripts_dir: ""                     # 留空自动探测；也可填 qa-toolkit/skill/qa-case-pipeline/scripts
  outputs:
    md: reports/qa-cases.md           # 生成的三层用例 Markdown
    xlsx: reports/qa-cases.xlsx       # 生成的三层用例 Excel（执行后回填状态）
  sheets:
    scenario: 核心链路用例             # 场景层工作表名
    api: API接口用例                  # 接口层工作表名
    ui: UI用例(Playwright)            # UI 层工作表名
  # qa-toolkit 其余能力：登录 → 真实 API 执行 → 模板/规范 → 产物审核
  # 每项可独立开关；脚本目录复用上面的 scripts_dir 自动探测
  extended:
    enabled: false                    # 总开关；打开后按下面各项开关执行
    login:
      enabled: false                  # login.mjs：Playwright 登录产出 storageState
      config: project/requirements/qa.config.json
      headed: false
      show: false
      env: {}                         # QA_USERNAME / QA_PASSWORD / QA_CHANNEL 等
    api:
      enabled: false                  # api_runner.js：真实 API 批量执行 + 断言
      plan: project/requirements/api-plan.json
      config: ""                      # 可选 qa.config.json
      out: reports/qa-api-results.json
      allow_write: false              # 写操作需显式授权，且只允许自建数据
      env: {}                         # REAL_BASE / REAL_PREFIX / PORTAL_TOKEN 等
    playwright_template: false        # 复制 ui_spec_template.ts 到批次记录
    copy_references: false            # 复制 excel-columns.md / project-config.md 到批次记录
    review:
      enabled: false                  # qa_review.py：产物审核（错误/告警/P0 占比）
      xlsx: reports/qa-cases.xlsx
      results: []                     # 可填多个结果 JSON 路径
      out: reports/qa-review.md
      strict: false                   # strict=true 时审核不通过返回非 0

# —— Ego 浏览器（UI 用例执行通道）——
# 两种模式，由 config/workflow.yaml → tests.ui_mode 选择：
#   cdp       : Playwright connect_over_cdp，接管已打开浏览器会话
#   ego_skill : 通过本地 CLI `ego-browser nodejs` 执行 JS 片段驱动 ego lite
#               （ego-browser skill 需单独安装：npx skills add citrolabs/ego-lite）
ego_browser:
  cli_path: ego-browser               # 本地 CLI 路径（onboarding 后通常在 ~/.local/bin）
  nodejs_timeout_sec: 30              # 单次 nodejs 调用超时
  skill_guide_cache: records/ego-browser-skill-guide.md
  learnings_dir: ""                   # 领域工具包目录；留空则自动探测 ego-browser/learnings
  auto_refresh_guide: true            # true=每次执行 ego-browser skill 刷新指南；false=用缓存
  skill_whitelist:                    # 允许 UI DSL `skill <name> <json_args>` 调用的真实能力
    - snapshot
    - capture
    - screenshot
    - evaluate
    - extract
    - fetch
    - cdp
    - wait_for
    - handoff
    - dom_inspect
    - mouse
    - keyboard
    - popup
    - upload
    - download
    - adopt
    - release
    - user_page
    - new_page
    - pages
    - tabs
    - wait_function
    - reload
    - clear_state
    - clear_cookies
    - claim_space
  cdp_endpoint: http://127.0.0.1:9222 # cdp 模式调试端口（运行时以此为准，workflow.yaml 仅兼容兜底）
  attach_context: first               # cdp 模式：复用哪个上下文（first=保留登录态）
  close_page_after: true              # cdp 模式：只关测试页，不关浏览器

