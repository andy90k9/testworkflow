- case_id: FUNC-001
  run_id: run-example
  title: 用户登录-正确账号密码登录成功
  module: auth
  priority: P1
  precondition: 系统中已存在账号 demo / 123456
  related_req: REQ-001
  steps:
    - step: 1
      action: 打开登录页，输入正确用户名和密码
      expected: 输入框正常回显，无校验报错
    - step: 2
      action: 点击登录按钮
      expected: 登录成功，跳转到首页并显示用户名

- case_id: FUNC-002
  run_id: run-example
  title: 用户登录-密码错误提示友好
  module: auth
  priority: P1
  precondition: 系统中已存在账号 demo
  related_req: REQ-001
  steps:
    - step: 1
      action: 输入正确用户名和错误密码，点击登录
      expected: 页面提示"用户名或密码错误"，不跳转
