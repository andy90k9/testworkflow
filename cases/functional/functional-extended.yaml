- case_id: FUNC-SMOKE-001
  title: API 冒烟：后端 /openapi.json 可达且注册了 87 个路由
  module: 接口冒烟
  priority: P0
  precondition: 被测服务在 127.0.0.1:8000 运行；backend/.venv 已安装依赖
  related_req: REQ-P95-AGG
  steps:
  - step: 1
    action: curl -sf --max-time 5 http://127.0.0.1:8000/openapi.json | python3 -c
      'import sys,json; d=json.load(sys.stdin); assert d["info"]["title"]=="Hologres
      慢SQL治理平台" and len(d["paths"])>80'
    expected: 后端 openapi.json 可访问，标题为「Hologres 慢SQL治理平台」，且注册路径数 > 80
  checks:
